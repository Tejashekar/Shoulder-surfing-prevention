<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">OcuVeil</title>
  <desc id="d">Animated banner: an observer approaches a laptop, the risk meter rises, and sensitive lines on screen are veiled.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="1" stop-color="#141a3c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="meter" gradientUnits="userSpaceOnUse" x1="742" y1="0" x2="1078" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="screenClip"><rect x="742" y="92" width="336" height="196" rx="6"/></clipPath>
    <clipPath id="meterClip"><rect x="742" y="322" width="336" height="10" rx="5"/></clipPath>
  </defs>

  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="20" fill="url(#grid)"/>
  <circle cx="910" cy="190" r="260" fill="url(#glow)">
    <animate attributeName="r" values="240;270;240" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Eye logo -->
  <g transform="translate(72 70)">
    <path d="M0 28 Q32 -8 64 28 Q32 64 0 28Z" fill="none" stroke="url(#title)" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="32" cy="28" r="11" fill="url(#title)">
      <animate attributeName="cx" values="32;24;40;32" dur="4s" repeatCount="indefinite"/>
    </circle>
    <rect x="-4" y="0" width="72" height="0" fill="#0b1124">
      <animate attributeName="height" values="0;0;56;0;0" keyTimes="0;0.46;0.5;0.54;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Title block -->
  <text x="152" y="112" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#title)" letter-spacing="1">OcuVeil</text>
  <text x="74" y="170" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600" fill="#e2e8f0">Context-aware shoulder-surfing defense</text>
  <text x="74" y="204" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#94a3b8">Sees who is looking. Knows what is sensitive. Veils only what matters.</text>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(74 240)">
      <rect width="78" height="30" rx="15" fill="#0f766e" fill-opacity="0.35" stroke="#5eead4" stroke-opacity="0.6"/>
      <text x="39" y="20" text-anchor="middle" fill="#99f6e4">Gaze</text>
    </g>
    <g transform="translate(162 240)">
      <rect width="104" height="30" rx="15" fill="#1d4ed8" fill-opacity="0.3" stroke="#60a5fa" stroke-opacity="0.6"/>
      <text x="52" y="20" text-anchor="middle" fill="#bfdbfe">Proximity</text>
    </g>
    <g transform="translate(276 240)">
      <rect width="76" height="30" rx="15" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-opacity="0.6"/>
      <text x="38" y="20" text-anchor="middle" fill="#c7d2fe">Dwell</text>
    </g>
    <g transform="translate(362 240)">
      <rect width="98" height="30" rx="15" fill="#6d28d9" fill-opacity="0.3" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="49" y="20" text-anchor="middle" fill="#ddd6fe">OCR · PII</text>
    </g>
    <g transform="translate(470 240)">
      <rect width="136" height="30" rx="15" fill="#be123c" fill-opacity="0.28" stroke="#fb7185" stroke-opacity="0.6"/>
      <text x="68" y="20" text-anchor="middle" fill="#fecdd3">Adaptive overlay</text>
    </g>
  </g>
  <text x="74" y="318" font-family="Consolas, Menlo, monospace" font-size="13" fill="#64748b">python main.py  ·  100% local  ·  no frames or OCR text stored</text>

  <!-- Observer (slides in behind the laptop) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.32;0.74;0.86;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="80 0;80 0;0 0;0 0;80 0;80 0" keyTimes="0;0.2;0.32;0.74;0.86;1" dur="7s" repeatCount="indefinite"/>
    <circle cx="1112" cy="96" r="26" fill="#334155"/>
    <path d="M1066 176 Q1068 132 1112 128 Q1156 132 1158 176Z" fill="#334155"/>
    <rect x="1080" y="64" width="64" height="66" rx="6" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="7 5">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="1080" y="44" width="68" height="16" rx="4" fill="#f43f5e"/>
    <text x="1114" y="56" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff">OBSERVER</text>
  </g>

  <!-- Laptop -->
  <rect x="730" y="80" width="360" height="220" rx="14" fill="#0b1124" stroke="#334155" stroke-width="2"/>
  <rect x="742" y="92" width="336" height="196" rx="6" fill="#f8fafc"/>
  <path d="M700 300 H1120 L1104 314 H716Z" fill="#334155"/>

  <g clip-path="url(#screenClip)" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#1e293b">
    <rect x="742" y="92" width="336" height="26" fill="#e2e8f0"/>
    <circle cx="758" cy="105" r="4.5" fill="#f87171"/><circle cx="772" cy="105" r="4.5" fill="#fbbf24"/><circle cx="786" cy="105" r="4.5" fill="#34d399"/>
    <text x="800" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Account settings</text>

    <g fill="#64748b">
      <text x="758" y="144">Name</text>
      <text x="758" y="170">Card</text>
      <text x="758" y="196">Email</text>
      <text x="758" y="222">Plan</text>
      <text x="758" y="248">PAN</text>
      <text x="758" y="274">Theme</text>
    </g>
    <text x="816" y="144">Demo User</text>
    <text x="816" y="170">4111 1111 1111 1111</text>
    <text x="816" y="196">demo@example.invalid</text>
    <text x="816" y="222">Student (annual)</text>
    <text x="816" y="248">ABCDE1234F</text>
    <text x="816" y="274">Dark mode</text>

    <!-- Veils over the sensitive values only -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.42;0.74;0.8;1" dur="7s" repeatCount="indefinite"/>
      <rect x="811" y="157" width="152" height="18" rx="4" fill="#94a3b8" filter="url(#blur)"/>
      <rect x="811" y="183" width="160" height="18" rx="4" fill="#94a3b8" filter="url(#blur)"/>
      <rect x="811" y="235" width="84" height="18" rx="4" fill="#94a3b8" filter="url(#blur)"/>
      <rect x="811" y="157" width="152" height="18" rx="4" fill="#6366f1" fill-opacity="0.18" stroke="#6366f1" stroke-opacity="0.55"/>
      <rect x="811" y="183" width="160" height="18" rx="4" fill="#6366f1" fill-opacity="0.18" stroke="#6366f1" stroke-opacity="0.55"/>
      <rect x="811" y="235" width="84" height="18" rx="4" fill="#6366f1" fill-opacity="0.18" stroke="#6366f1" stroke-opacity="0.55"/>
    </g>

    <!-- OCR scan line -->
    <rect x="742" y="118" width="336" height="2" fill="#6366f1" opacity="0.55">
      <animate attributeName="y" values="118;286;118" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Risk meter -->
  <text x="742" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">RISK</text>
  <rect x="742" y="322" width="336" height="10" rx="5" fill="#1e293b"/>
  <g clip-path="url(#meterClip)">
    <rect x="742" y="322" height="10" fill="url(#meter)" width="40">
      <animate attributeName="width" values="40;40;210;336;336;40;40" keyTimes="0;0.22;0.32;0.4;0.74;0.86;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end">
    <text x="1078" y="350" fill="#34d399" opacity="1">LOW
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.26;0.3;0.8;0.84;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="1078" y="350" fill="#f43f5e" opacity="0">HIGH · VEILED
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.4;0.74;0.78;1" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
